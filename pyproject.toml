[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-monitoring-exporter"
# Single source of truth: read from the VERSION file (CI bumps it via the
# bump-version job in .github/workflows/ci.yml; release.yml tags from it).
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "oci==2.188.0",
    "prometheus-client==0.26.0",
    "PyYAML==6.0.3",
    "opentelemetry-api",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-logging",
]

[project.optional-dependencies]
dev = [
    "bandit",
    "pylint==4.1.3",
    "tox==4.67.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pylint.main]
# Not 0: parallel pylint pickles its linter with dill, which breaks on Python 3.15
# (AttributeError: code object has no attribute co_lnotab).
jobs = 1
persistent = true
recursive = true

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "too-many-statements",
    "too-few-public-methods",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "line-too-long",
    "logging-fstring-interpolation",
    "broad-exception-caught",
    "too-many-return-statements",
    "protected-access",
    "too-many-nested-blocks",
]

[tool.pylint.format]
max-line-length = 120
indent-string = "    "

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "e", "f", "db", "ns", "cfg"]

[tool.pylint.design]
max-args = 8
max-locals = 20

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.pylint.imports]
allow-wildcard-with-all = false
