[tox]
envlist = py313,py314,py315

[testenv]
extras = dev
commands =
    pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml
    py315: pylint src/
    py315: bandit -r src/

[testenv:pylint]
extras = dev
commands = pylint src/

[testenv:pytest]
extras = dev
commands = pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=html

[testenv:bandit]
extras = dev
commands = bandit -r src/
