name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!256.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '35 22 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@b5f1653b3f3a9750af00c7bfda9af04fe263c1b1
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@b5f1653b3f3a9750af00c7bfda9af04fe263c1b1
    with:
      age_days: 30
      dry_run: false
