# Backstage catalog descriptor. Discovered automatically -- the portal's GitHub
# provider reads catalog-info.yaml from the default branch of every repo the
# tnoff-backstage App can see, so adding this file is the whole of onboarding.
# Nothing needs registering by hand, and it appears on the next 3h sweep.
#
# No annotations, deliberately. github.com/project-slug is DERIVED: the portal
# registers AnnotateScmSlugEntityProcessor, which reads the slug off the location
# this file was fetched from, so writing one here would duplicate something that
# cannot go stale. The rest -- backstage.io/techdocs-ref, the kubernetes
# selectors, the grafana selectors -- each assert that a target EXISTS, and none
# of those targets do yet. They arrive with the plugins that read them.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: oci-monitoring-exporter
  description: >-
    Polls OCI Monitoring's SummarizeMetricsData API and re-exposes the latest datapoints
    in Prometheus exposition format, which is how OCI-side metrics reach Mimir.
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  # Part of the observability stack, whose other eight components have no repo of
  # their own and are declared in docker-apps. This is the one piece of it that
  # is built here, so the System membership has to be written on this side.
  system: monitoring
  consumesApis:
    - api:default/image-bump
  dependsOn:
    # Runs next to the exporter in its pod and trades the pod's ServiceAccount token for the
    # OCI session token the exporter signs with (OCI_AUTH=resource_principal; see
    # README.md, Authentication). The policy it is matched against is in terraform.
    - component:default/rpst-sidecar
